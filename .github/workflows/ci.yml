name: CI

# ─────────────────────────────────────────────────────────────────────
#  Trigger: every push/PR to main runs build + tests.
#  Purpose: gate merges at "all tests pass on Windows + Release config".
#  No publish / no release here — that's the release.yml job's job.
# ─────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress CI on the same ref when a new commit lands.
# Saves Runner-minutes on PRs that get force-pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Release, win-x64)
    # 20 min cap; default is 360 min which wastes Runner-minutes on hung builds.
    timeout-minutes: 20
    runs-on: windows-latest

    steps:
      # 1. Source — full history (fetch-depth: 0) so any git-version-derived
      #    attribute tests can resolve commits if needed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. .NET 8 SDK — pin to a major version so the runner's automatic
      #    bumps don't accidentally jump to .NET 9 mid-release.
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 3. Restore both the app and test projects at solution level so
      #    any new references added by future PRs are caught early.
      - name: Restore
        run: dotnet restore MosquitoNetCalculator.sln

      # 4. Build. --no-restore because the restore step above is the source
      #    of truth (avoids silent cache mismatches between restore and build).
      #    RID-specific publish is release.yml's job; building the SOLUTION with
      #    -r is not supported by newer SDKs (NETSDK1134) — happened when the
      #    runner image moved to .NET SDK 10 (2026-09).
      - name: Build (Release)
        run: dotnet build MosquitoNetCalculator.sln -c Release --no-restore -v minimal

      # 5. Test. --no-build forces test to use freshly built binaries
      #    (prevents stale DLLs from a previous test run). xUnit's
      #    [Collection("STA")] in ProgressBarUpdateAnimatorTests.cs
      #    handles WPF STA isolation internally — no project-config needed.
      #    Retry (v3.53.1): same STA teardown host crash as release.yml —
      #    the run reports "Passed! Failed: 0" and then the host dies,
      #    failing an otherwise green gate. Retry rescues host crashes,
      #    not real failures.
      #    --blame-hang (v3.54.1): main CI runs hung with zero output
      #    from 27.09 (last green 27.09 11:22 UTC, first failure
      #    28.09, run 36397580663) — the single STA worker parked in
      #    Queue.GetConsumingEnumerable() never pumped its dispatcher,
      #    so UpdateService's blocking Dispatcher.Invoke from a
      #    background thread waited forever. Fixed in code (WpfTestHelper
      #    idle-pump + UpdateService BeginInvoke); blame-hang is the
      #    guard: a future hang dies after 5 minutes and names the
      #    in-flight test in TestResults/<guid>/Sequence.xml instead
      #    of burning the whole 20-minute job timeout.
      - name: Test
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_on: error
          command: dotnet test MosquitoNetCalculator.sln -c Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 5min --blame-hang-dump-type none

      # 5b. Keep VSTest blame diagnostics on failure — the workspace
      #     is discarded with the failed job, so without this upload
      #     the culprit named in Sequence.xml is unreachable from CI.
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            **/TestResults/*.xml
            **/TestResults/*.dmp
          if-no-files-found: ignore
          retention-days: 14

      # 6. Upload build artifacts so release workflow can reuse them
      #    (optional — release.yml rebuilds from tag for reproducibility).
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            MosquitoNetCalculator/bin/Release/net8.0-windows/win-x64/
          if-no-files-found: warn
